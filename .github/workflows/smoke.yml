name: Smoke

"on":
  repository_dispatch:
    types:
      - vercel.deployment.promoted
  workflow_dispatch:
    inputs:
      deployment_url:
        description: smoke 대상 URL (비우면 Production 도메인)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # 수동 Preview 실행이 Production smoke를 취소하지 않도록 대상별로 가른다
  group: smoke-${{ inputs.deployment_url || 'production' }}
  cancel-in-progress: true

env:
  DEPLOYMENT_URL: ${{ inputs.deployment_url || 'https://loop-pack-fe-l2-vol1-gamma.vercel.app' }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.15.1
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Record deployment info
        # 외부에서 온 payload를 run 스크립트에 직접 넣지 않고 환경 변수로 받아 스크립트 주입을 막는다
        env:
          TRIGGER: ${{ github.event_name }}
          PAYLOAD_DEPLOYMENT_ID: ${{ github.event.client_payload.id }}
          PAYLOAD_COMMIT_SHA: ${{ github.event.client_payload.git.sha }}
          PAYLOAD_ENVIRONMENT: ${{ github.event.client_payload.environment }}
        run: |
          {
            echo "### Smoke test target"
            echo ""
            echo "| 항목 | 값 |"
            echo "| --- | --- |"
            echo "| DEPLOYMENT_URL | ${DEPLOYMENT_URL} |"
            echo "| trigger | ${TRIGGER} |"
            echo "| deployment id (client_payload.id) | ${PAYLOAD_DEPLOYMENT_ID:-N/A (manual run)} |"
            echo "| commit SHA (client_payload.git.sha) | ${PAYLOAD_COMMIT_SHA:-N/A (manual run)} |"
            echo "| environment (client_payload.environment) | ${PAYLOAD_ENVIRONMENT:-N/A (manual run)} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run smoke tests
        # secret은 이 step에만 전달한다
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: pnpm test:smoke
